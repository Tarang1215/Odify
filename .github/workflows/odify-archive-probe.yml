name: Odify Archive Format Probe
on:
  push:
    branches: [feature/odify-v12-master-db]
    paths: ['.github/workflows/odify-archive-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Oricon historical CSV and ListenBrainz global
        run: |
          python3 - <<'PY'
          import urllib.request,csv,io,json
          url='https://raw.githubusercontent.com/sichengchen/oricon/main/public/data/oricon_singles.csv'
          try:
            resp=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'OdifyMetadata/1.0'}),timeout=30)
            content=resp.read()
            print('ORICON_BYTES',len(content),flush=True)
            for codec in ('utf-8-sig','cp932','shift_jis'):
              try:
                text=content.decode(codec)
                rows=list(csv.reader(io.StringIO(text)))
                print('ORICON_CODEC',codec,'HEADER',repr(rows[:4]),flush=True)
                break
              except UnicodeDecodeError:pass
          except Exception as e:print('ORICON_ERROR',str(e),flush=True)
          lb='https://api.listenbrainz.org/1/stats/sitewide/recordings?range=week&count=10'
          try:
            req=urllib.request.Request(lb,headers={'User-Agent':'OdifyCatalog/0.1 metadata personal research'})
            with urllib.request.urlopen(req,timeout=30) as r:
              body=json.load(r)
            print('LISTENBRAINZ_KEYS',list(body.keys()),
                  'PAYLOAD_KEYS',list(body.get('payload',{}).keys()),
                  'FIRST',json.dumps((body.get('payload',{}).get('recordings') or [])[:1],ensure_ascii=False)[:900],flush=True)
          except Exception as e:print('LISTENBRAINZ_ERROR',repr(e),flush=True)
          PY
