name: Odify V4.3 catalog export safety tests
on:
  push:
    branches: [feature/odify-v12-master-db]
    paths:
      - 'scripts/odify_altlink_v43_enrich_export.py'
      - 'scripts/odify_altlink_v43_master_overlay.py'
      - 'scripts/tests/test_odify_altlink_v43_enrich_export.py'
      - 'scripts/tests/test_odify_altlink_v43_master_overlay.py'
      - '.github/workflows/odify-altlink-v43-export-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify derived DB is non-destructive and preserves verified original links
        run: |
          python -m unittest discover -s scripts/tests -p 'test_odify_altlink_v43_enrich_export.py' -v
          python -m unittest discover -s scripts/tests -p 'test_odify_altlink_v43_master_overlay.py' -v
