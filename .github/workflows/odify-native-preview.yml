name: Odify Independent Native Android Preview

on:
  push:
    branches:
      - feature/odify-native-v1-design
      - feature/odify-native-ui-v2
      - feature/odify-native-ui-v3
      - feature/odify-native-ui-v4-motion
      - feature/odify-native-ui-v5-floating-controls
      - feature/odify-native-v6-drive-stream
      - feature/odify-native-v7-player-polish
      - feature/odify-v8-drive-library
      - feature/odify-v9-15gb-pilot
      - feature/odify-v10-metadata-library
      - feature/odify-v11-native-titles-artwork
    paths:
      - 'native-android/**'
      - '.github/workflows/odify-native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odify-native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore mandatory stable signing identity
        env:
          ODIFY_DEBUG_KEYSTORE_BASE64: ${{ secrets.ODIFY_DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ODIFY_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::ODIFY_DEBUG_KEYSTORE_BASE64 repository secret is required. Refusing to generate a fresh SHA-1 signing identity.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ODIFY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # Pin the certificate fingerprint: a missing/wrong secret must fail
          # before Gradle can produce an APK with an incompatible signature.
          FOUND_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>/dev/null | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d '\r')"
          EXPECTED_SHA1="65:6D:46:5E:5C:72:9B:DF:21:A4:02:6C:76:4D:FB:63:6F:18:99:E5"
          if [ "$FOUND_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signing certificate SHA-1 mismatch. Expected $EXPECTED_SHA1, got $FOUND_SHA1"
            exit 1
          fi
          echo "Odify stable preview signing SHA-1: $FOUND_SHA1"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bundle licensed Pretendard fonts
        run: |
          mkdir -p native-android/app/src/main/res/font native-android/licenses
          BASE=https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static
          for WEIGHT in Regular Medium SemiBold Bold; do
            case "$WEIGHT" in
              Regular) NAME=regular ;;
              Medium) NAME=medium ;;
              SemiBold) NAME=semibold ;;
              Bold) NAME=bold ;;
            esac
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 \
              "$BASE/Pretendard-$WEIGHT.otf" \
              --output "native-android/app/src/main/res/font/pretendard_$NAME.otf"
            test "$(wc -c < native-android/app/src/main/res/font/pretendard_$NAME.otf)" -gt 100000
          done
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/orioncactus/pretendard/main/LICENSE \
            --output native-android/licenses/Pretendard-OFL.txt
      - name: Verify audio metadata parser tests
        run: gradle -p native-android :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Compile standalone preview APK
        run: gradle -p native-android :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK independent package
        run: |
          APK=native-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.odify.music.nativepreview.v11.debug'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          APK_SHA1="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-1 digest: //p' | head -n 1)"
          test "$APK_SHA1" = "656d465e5c729bdf21a4026c764dfb636f1899e5" ||
            { echo "::error::APK signer changed unexpectedly: $APK_SHA1"; exit 1; }
      - name: Verify stable certificate after build
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | grep 'SHA1:'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Odify-Native-Stable-Preview-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14