name: Odify integration verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/odify-verify.yml"
      - ".github/ci-trigger"

permissions:
  contents: read

concurrency:
  group: odify-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter + Rust + Android arm64 validation builds
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MORNYE_DISCORD_SDK: "0"
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"
      MORNYE_DISCORD_SDK: "0"
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"
    steps:
      - name: Checkout Odify overlay
        uses: actions/checkout@v4
      - name: Validate Python scripts and assembly anchors
        run: |
          python3 scripts/check_overlay.py
          python3 -m unittest discover -s tests -v
      - name: Assemble pinned Mornye v5.2.1 with reviewed Odify patches
        run: python3 scripts/assemble.py
      - name: Setup Java 25 (matching upstream)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Flutter pinned to upstream
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: build/Odify/.fvmrc
          cache: true
      - name: Fetch Dart/Flutter dependencies
        working-directory: build/Odify
        run: flutter pub get
      - name: Flutter static analyzer
        working-directory: build/Odify
        run: flutter analyze --no-fatal-infos
      - name: Odify music, sync, artwork and UI regression tests
        working-directory: build/Odify
        run: |
          flutter test test/odify_discovery_test.dart test/odify_metadata_test.dart test/odify_quick_access_test.dart test/odify_sync_merge_test.dart test/odify_sync_coordinator_test.dart test/odify_drive_transport_test.dart test/odify_sync_settings_test.dart test/odify_home_feed_test.dart test/odify_home_widget_test.dart test/odify_device_artwork_test.dart test/odify_glass_design_test.dart
      - name: Setup Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Install Android SDK + NDK (matching upstream)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0" "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Cache Rust crates and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/Odify/rust_backend/target
          key: odify-cargo-${{ runner.os }}-arm64-${{ hashFiles('build/Odify/rust_backend/rust-toolchain.toml', 'build/Odify/rust_backend/Cargo.lock') }}
          restore-keys: |
            odify-cargo-${{ runner.os }}-arm64-
      - name: Prepare Rust, Gradle, native prerequisites
        run: |
          cd build/Odify/rust_backend
          rustup show
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev ffmpeg
          printf 'flutter.sdk=%s\nflutter.versionName=0.9.0\nflutter.versionCode=170\n' "$FLUTTER_ROOT" > ../android/local.properties
      - name: Compile arm64 Android debug APK
        working-directory: build/Odify
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Upload Odify debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: odify-debug-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Odify/build/app/outputs/apk/debug/*.apk
            build/Odify/build/app/outputs/flutter-apk/*.apk
      - name: Remove debug-only Flutter integration_test registrar for release
        run: |
          python3 scripts/strip_release_test_plugin.py build/Odify/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
      - name: Compile arm64 Android release APK (CI debug-key test signing)
        working-directory: build/Odify
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Check isolated release identity and startup contract
        working-directory: build/Odify
        run: |
          set -euo pipefail
          git rev-parse HEAD | grep '^8e4504e72ddcda6bdf6df5e1275396f46e9dfb9f
        working-directory: build/Odify
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          find build/app/outputs/apk -type f -name '*.apk' -print | sort
          RELEASE="$(find build/app/outputs/apk/release -maxdepth 1 -name '*arm64-v8a*.apk' | head -1)"
          DEBUG="$(find build/app/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a*.apk' | head -1)"
          test -n "$RELEASE" && test -n "$DEBUG"
          "$SIGNER" verify --verbose "$RELEASE"
          "$SIGNER" verify --verbose "$DEBUG"
          "$AAPT" dump badging "$RELEASE" | grep -E "package: name='com.odify.music' versionCode='170' versionName='0.9.0'"
          "$AAPT" dump badging "$DEBUG" | grep "package: name='com.odify.music.debug'"
          du -h "$RELEASE" "$DEBUG"
      - name: Upload Odify release APK (CI test signing, NOT stable update key)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: odify-release-arm64-ci-test
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Odify/build/app/outputs/apk/release/*arm64-v8a*.apk

          grep -q "static const String appName = 'Odify';" lib/constants/app_info.dart
          grep -q "return false; // Never force installation of a vendor APK." lib/screens/main_shell_startup_prompts.dart
          grep -q 'waitForActivityAttachment(binding)' lib/main.dart
          grep -q 'class MainActivity' android/app/src/main/kotlin/com/zarz/mornye/MainActivity.kt
          test -f android/app/src/main/kotlin/com/zarz/mornye/OdifyMediaStorePlugin.kt
          test -f android/app/src/main/kotlin/com/zarz/mornye/OdifyYtDlpPlugin.kt
      - name: Validate generated APK identity, install signing, and sizes
        working-directory: build/Odify
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          find build/app/outputs/apk -type f -name '*.apk' -print | sort
          RELEASE="$(find build/app/outputs/apk/release -maxdepth 1 -name '*arm64-v8a*.apk' | head -1)"
          DEBUG="$(find build/app/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a*.apk' | head -1)"
          test -n "$RELEASE" && test -n "$DEBUG"
          "$SIGNER" verify --verbose "$RELEASE"
          "$SIGNER" verify --verbose "$DEBUG"
          "$AAPT" dump badging "$RELEASE" | grep -E "package: name='com.odify.music' versionCode='170' versionName='0.9.0'"
          "$AAPT" dump badging "$DEBUG" | grep "package: name='com.odify.music.debug'"
          du -h "$RELEASE" "$DEBUG"
      - name: Upload Odify release APK (CI test signing, NOT stable update key)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: odify-release-arm64-ci-test
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Odify/build/app/outputs/apk/release/*arm64-v8a*.apk
