name: Odify integration verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/odify-verify.yml"
      - ".github/ci-trigger"

permissions:
  contents: read

concurrency:
  group: odify-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter and Rust Android ARM64 debug/release
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      MORNYE_DISCORD_SDK: "0"
      MORNYE_RUST_ANDROID_ABIS: "arm64-v8a"
      SPOTIFLAC_DISCORD_SDK: "0"
      SPOTIFLAC_RUST_ANDROID_ABIS: "arm64-v8a"
      # Public OAuth Web client ID; matching Android signing SHA-1 is configured in Google Cloud.
      ODIFY_GOOGLE_SERVER_CLIENT_ID: ${{ vars.ODIFY_GOOGLE_SERVER_CLIENT_ID }}
    steps:
      - name: Checkout immutable Odify overlay
        uses: actions/checkout@v4
      - name: Check Python fixtures and source lock
        run: |
          python3 scripts/check_overlay.py
          python3 -m unittest discover -s tests -v
      - name: Assemble pinned Mornye v5.2.1 into Odify
        run: python3 scripts/assemble_v521.py
      - name: Verify no upstream forced updater and safe Activity startup
        working-directory: build/Odify
        run: |
          set -euo pipefail
          # Build an immutable Odify-owned vendor snapshot, not Mornye HEAD.
          test "$(git rev-parse HEAD)" = "191fd35e1d9cf147a54312453c39e717408d0454"
          grep -q "8e4504e72ddcda6bdf6df5e1275396f46e9dfb9f" ODIFY_VENDOR_BASE.txt
          grep -q "static const String appName = 'Odify';" lib/constants/app_info.dart
          grep -q "return false; // Never force installation of a vendor APK." lib/screens/main_shell_startup_prompts.dart
          grep -q "waitForActivityAttachment(binding)" lib/main.dart
          test -f android/app/src/main/kotlin/com/zarz/mornye/OdifyMediaStorePlugin.kt
          test -f android/app/src/main/kotlin/com/zarz/mornye/OdifyYtDlpPlugin.kt
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: build/Odify/.fvmrc
          cache: true
      - name: Fetch Dart dependencies
        working-directory: build/Odify
        run: flutter pub get
      - name: Analyze all Dart source
        working-directory: build/Odify
        run: flutter analyze --no-fatal-infos
      - name: Test music library, Drive sync, MediaStore art and glass UI
        working-directory: build/Odify
        run: |
          flutter test test/odify_discovery_test.dart test/odify_metadata_test.dart test/odify_quick_access_test.dart test/odify_sync_merge_test.dart test/odify_sync_coordinator_test.dart test/odify_drive_transport_test.dart test/odify_playlist_track_link_test.dart test/odify_lyrics_fallback_test.dart test/odify_sync_settings_test.dart test/odify_home_feed_test.dart test/odify_home_widget_test.dart test/odify_device_artwork_test.dart test/odify_glass_design_test.dart
      - name: Setup Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0" "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/Odify/rust_backend/target
          key: odify-mornye521-${{ runner.os }}-arm64-${{ hashFiles('build/Odify/rust_backend/rust-toolchain.toml', 'build/Odify/rust_backend/Cargo.lock') }}
          restore-keys: |
            odify-mornye521-${{ runner.os }}-arm64-
      - name: Prepare native compiler
        run: |
          cd build/Odify/rust_backend
          rustup show
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev ffmpeg
          printf 'flutter.sdk=%s\nflutter.versionName=0.9.0\nflutter.versionCode=170\n' "$FLUTTER_ROOT" > ../android/local.properties
      - name: Compile Android debug APK through Flutter (JIT kernel)
        working-directory: build/Odify
        run: flutter build apk --debug --target-platform android-arm64 --split-per-abi --dart-define=ODIFY_GOOGLE_SERVER_CLIENT_ID="$ODIFY_GOOGLE_SERVER_CLIENT_ID"
      - name: Upload debug APK, independent of release result
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: odify-521-debug-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Odify/build/app/outputs/apk/debug/*arm64-v8a*.apk
      - name: Remove dev-only integration test plugin from release registrant
        run: |
          python3 scripts/strip_release_test_plugin.py build/Odify/android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java
      - name: Compile Android release APK through Flutter AOT (includes libapp.so)
        working-directory: build/Odify
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=ODIFY_GOOGLE_SERVER_CLIENT_ID="$ODIFY_GOOGLE_SERVER_CLIENT_ID"
      - name: Verify APK signatures, own package/version, and native startup ELF
        working-directory: build/Odify
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          RELEASE="$(find build/app/outputs/apk/release -maxdepth 1 -name '*arm64-v8a*.apk' | head -1)"
          DEBUG="$(find build/app/outputs/apk/debug -maxdepth 1 -name '*arm64-v8a*.apk' | head -1)"
          test -n "$RELEASE" && test -n "$DEBUG"
          "$SIGNER" verify --verbose "$RELEASE"
          "$SIGNER" verify --verbose "$DEBUG"
          # Log only the package/version lines, never user data or credentials.
          RELEASE_PACKAGE="$("$AAPT" dump badging "$RELEASE" | grep '^package:')"
          DEBUG_PACKAGE="$("$AAPT" dump badging "$DEBUG" | grep '^package:')"
          printf 'Release manifest: %s\\n' "$RELEASE_PACKAGE"
          printf 'Debug manifest: %s\\n' "$DEBUG_PACKAGE"
          [[ "$RELEASE_PACKAGE" == *"name='com.odify.music' "* ]]
          # Flutter --split-per-abi adds the ARM64 ABI offset (2000)
          # to the base pubspec versionCode 170.
          [[ "$RELEASE_PACKAGE" == *"versionCode='2170' "* ]]
          [[ "$RELEASE_PACKAGE" == *"versionName='0.9.0'"* ]]
          [[ "$DEBUG_PACKAGE" == *"name='com.odify.music.debug' "* ]]
          [[ "$DEBUG_PACKAGE" == *"versionCode='2170' "* ]]
          python3 ../../scripts/verify_android_apk.py "$RELEASE" --mode release
          python3 ../../scripts/verify_android_apk.py "$DEBUG" --mode debug
          du -h "$RELEASE" "$DEBUG"
      - name: Upload signed Release test APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: odify-521-release-arm64-test-key
          if-no-files-found: error
          retention-days: 14
          path: |
            build/Odify/build/app/outputs/apk/release/*arm64-v8a*.apk
