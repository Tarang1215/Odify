name: Odify Link Pilot Sheets Review Export
on:
  push:
    branches: [feature/odify-v12-master-db]
    paths: ['.github/workflows/odify-link-pilot-review-export.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: Tarang1215/Odify
          run-id: 39956200144
          name: odify-piped-100-song-retest-results
          github-token: ${{ github.token }}
          path: .local
      - name: Export 100 source-linked proposals as small JSON records
        run: |
          python - <<'PY'
          import json,sqlite3
          con=sqlite3.connect('.local/odify_link_provider_state.sqlite3')
          con.row_factory=sqlite3.Row
          rows=con.execute("""
            SELECT country,chart_rank,artist,title,status,video_id,confidence,
                   eligible_candidates,candidates,reason
              FROM proposal ORDER BY
                 CASE country WHEN 'kr' THEN 1 WHEN 'jp' THEN 2
                              WHEN 'us' THEN 3 ELSE 4 END, chart_rank
          """).fetchall()
          assert len(rows)==100,len(rows)
          for row in rows:
              print('ODIFY_PILOT_EXPORT '+json.dumps(dict(row),ensure_ascii=False))
          print('ODIFY_PILOT_EXPORT_DONE',len(rows))
          PY
