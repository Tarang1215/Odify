name: Odify V12 Android 16 Instrumentation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/odify-v12-master-db
    paths:
      - 'native-android/**'
      - '.github/workflows/odify-v12-android16-instrumentation.yml'

permissions:
  contents: read

concurrency:
  group: odify-v12-android16-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android16-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore verified Odify signing key
        shell: bash
        env:
          ODIFY_DEBUG_KEYSTORE_BASE64: ${{ secrets.ODIFY_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ODIFY_DEBUG_KEYSTORE_BASE64" ||
            { echo '::error::Permanent signing key is required'; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ODIFY_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d '\r')"
          test "$SHA1" = "65:6D:46:5E:5C:72:9B:DF:21:A4:02:6C:76:4D:FB:63:6F:18:99:E5" ||
            { echo '::error::Incorrect signing certificate'; exit 1; }
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download licensed UI fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-android/app/src/main/res/font
          BASE=https://raw.githubusercontent.com/orioncactus/pretendard/main/packages/pretendard/dist/public/static
          for weight in Regular Medium SemiBold Bold; do
            case "$weight" in
              Regular) name=regular ;;
              Medium) name=medium ;;
              SemiBold) name=semibold ;;
              Bold) name=bold ;;
            esac
            curl --fail --location --retry 3 "$BASE/Pretendard-$weight.otf" \
              --output "native-android/app/src/main/res/font/pretendard_$name.otf"
          done
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 16 native playback and library tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle -p native-android :app:connectedDebugAndroidTest --stacktrace --no-daemon
      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Odify-V12-Android16-Instrumentation
          path: |
            native-android/app/build/reports/androidTests/connected/
            native-android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14
